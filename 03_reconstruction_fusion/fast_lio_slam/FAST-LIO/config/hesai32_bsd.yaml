common:
    lid_topic:  "/Pandar0/hesailidar0/pandar"
    imu_topic:  "/wit/imu"
    time_sync_en: true         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

preprocess:
    lidar_type: 4                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
    scan_line: 32
    timestamp_unit: 0            # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
    blind: 2

mapping:
    acc_cov: 0.01
    gyr_cov: 0.01
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     100.0
    extrinsic_est_en:  true      # true: enable the online estimation of IMU-LiDAR extrinsic,
    # extrinsic_T: [ 0, 0, -0.0738 ]
    # extrinsic_R: [ 0, -1, 0,
    #               -1, 0, 0,
    #               0, 0, -1 ]
    extrinsic_T: [  0, -0.0149, -0.0705]
    extrinsic_R: [ 0.997276, -0.016759,  0.071832,
                 -0.020517, -0.998441,  0.051902,  
                  0.070850, -0.053234, -0.996065]

    gravity_m_s2: 9.81

publish:     
    scan_publish_en:  true       # 'false' will close all the point cloud output
    dense_publish_en: false       # false will low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # output the point cloud scans in a body frame
    publish_cloud_in_imu_frame: false # output the point cloud scans in IMU-frame or lidar-frame

pcd_save:
    pcd_save_en: true
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file.